<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Dvris智能系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: #2563eb;
            color: white;
            padding:16px 24px;
            font-size:20px;
            font-weight:bold;
        }
        .chat-area {
            height: 550px;
            padding:20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }
        .msg {
            margin-bottom:16px;
        }
        .user-msg {
            text-align:right;
        }
        .user-msg .content {
            background:#2563eb;
            color:white;
            display:inline-block;
            padding:10px 14px;
            border-radius:10px 10px 2px 10px;
            max-width:70%;
            white-space:pre-wrap;
        }
        .bot-msg .content {
            background:#eef2ff;
            color:#111;
            display:inline-block;
            padding:10px 14px;
            border-radius:10px 10px 10px 2px;
            max-width:70%;
            white-space:pre-wrap;
        }
        .control-bar{
            padding:16px 20px;
        }
        .row{
            display:flex;
            gap:10px;
            margin-bottom:12px;
            align-items:center;
        }
        input[type="text"]{
            flex:1;
            padding:10px;
            border:1px solid #d1d5db;
            border-radius:6px;
            font-size:14px;
        }
        textarea{
            flex:1;
            padding:10px;
            border:1px solid #d1d5db;
            border-radius:6px;
            font-size:14px;
            height:80px;
        }
        button{
            padding:10px 18px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;
        }
        .btn-send{
            background:#2563eb;
            color:white;
        }
        .btn-upload{
            background:#10b981;
            color:white;
        }
        .loading{
            color:#888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Dvris智能系统</div>
        <div class="chat-area" id="chatBox"></div>
        <div class="control-bar">
            <div class="row">
                <label>会话ID：</label>
                <input id="sessionId" type="text" value="session_001">
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">上传文档</button>
                <input id="fileInput" type="file" style="display:none" accept=".pdf,.docx,.txt,.md">
            </div>
            <div class="row">
                <textarea id="queryInput" placeholder="请输入问题，例如：现在几点？1+2*3等于多少？文档内容是什么？"></textarea>
                <button class="btn-send" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>

<script>
const chatBox = document.getElementById("chatBox");
const sessionIdEl = document.getElementById("sessionId");
const queryEl = document.getElementById("queryInput");
const fileInput = document.getElementById("fileInput");

// 渲染消息
function appendMsg(text, isUser){
    const div = document.createElement("div");
    div.className = "msg " + (isUser?"user-msg":"bot-msg");
    div.innerHTML = `<div class="content">${escapeHtml(text)}</div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
function escapeHtml(str){
    return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// 对话请求
async function sendChat(){
    const sid = sessionIdEl.value.trim();
    const q = queryEl.value.trim();
    if(!sid || !q) return;
    appendMsg(q, true);
    queryEl.value = "";
    appendMsg("思考中...", false);
    try{
        const form = new FormData();
        form.append("session_id", sid);
        form.append("query", q);
        const res = await fetch("/chat", {method:"POST", body:form});
        const json = await res.json();
        // 删除loading提示
        chatBox.removeChild(chatBox.lastChild);
        if(json.code===0){
            appendMsg(json.data.answer, false);
        }else{
            appendMsg(json.msg, false);
        }
    }catch(err){
        chatBox.removeChild(chatBox.lastChild);
        appendMsg("网络异常", false);
    }
}

// 文件上传事件
fileInput.onchange = async function(){
    const file = this.files[0];
    if(!file) return;
    const sid = sessionIdEl.value.trim();
    const form = new FormData();
    form.append("session_id", sid);
    form.append("file", file);
    appendMsg(`[上传文件] ${file.name}`, true);
    appendMsg("文件解析入库中...", false);
    try{
        const res = await fetch("/upload", {method:"POST", body:form});
        const json = await res.json();
        chatBox.removeChild(chatBox.lastChild);
        appendMsg(json.msg, false);
    }catch(err){
        chatBox.removeChild(chatBox.lastChild);
        appendMsg("文件上传失败", false);
    }
}

// 回车发送
queryEl.addEventListener("keydown", function(e){
    if(e.ctrlKey && e.key === "Enter") sendChat();
})
</script>
</body>
</html>
